<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F7F5F0">
<title>Menu · Olympos Lodge</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Cormorant+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --color-warm-gold: #8E7441;
    --color-warm-gold-deep: #6e5a32;
    --color-cream: #F7F5F0;
    --color-text: #1c1814;
    --color-text-light: #6b6b6b;
    --color-rule: #c9c1ad;
    --font-heading: 'Cormorant Garamond', 'Georgia', serif;
    --font-sc: 'Cormorant SC', serif;
    --ease-bleed: cubic-bezier(0.22, 1, 0.36, 1);
  }

  html, body { height: 100%; }

  body {
    font-family: var(--font-heading);
    color: var(--color-text);
    background: var(--color-cream);
    background-image:
      radial-gradient(ellipse 90% 60% at 50% 0%, rgba(142, 116, 65, 0.08), transparent 70%),
      radial-gradient(ellipse 90% 60% at 50% 100%, rgba(142, 116, 65, 0.05), transparent 70%);
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px calc(40px + env(safe-area-inset-bottom));
    padding-top: calc(40px + env(safe-area-inset-top));
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .frame {
    width: 100%;
    max-width: 380px;
    text-align: center;
  }

  .lodge-name {
    font-family: var(--font-sc);
    font-size: 11px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--color-warm-gold);
    margin-bottom: 32px;
    opacity: 0;
    animation: fade-in 1100ms var(--ease-bleed) 200ms forwards;
  }

  .title-wrap {
    margin-bottom: 44px;
  }

  .title {
    font-family: var(--font-heading);
    font-weight: 300;
    font-style: italic;
    font-size: 84px;
    letter-spacing: 0.01em;
    line-height: 1;
    color: var(--color-text);
    display: inline-block;
    clip-path: inset(0 100% 0 0);
    animation: ink-bleed 1400ms var(--ease-bleed) 450ms forwards;
  }

  .ornament {
    margin: 22px auto 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    opacity: 0;
    animation: fade-in 900ms var(--ease-bleed) 1100ms forwards;
  }

  .ornament-rule {
    width: 44px;
    height: 1px;
    background: var(--color-rule);
  }

  .ornament-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--color-warm-gold);
  }

  .languages {
    list-style: none;
    border-top: 1px solid var(--color-rule);
  }

  .lang-row {
    border-bottom: 1px solid var(--color-rule);
    opacity: 0;
    transform: translateY(8px);
    animation: row-rise 900ms var(--ease-bleed) forwards;
  }

  .lang-row:nth-child(1) { animation-delay: 1200ms; }
  .lang-row:nth-child(2) { animation-delay: 1320ms; }
  .lang-row:nth-child(3) { animation-delay: 1440ms; }

  .lang-link {
    display: grid;
    grid-template-columns: 44px 1fr 44px;
    align-items: center;
    min-height: 64px;
    padding: 18px 4px;
    color: var(--color-text);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: color 320ms ease, background 320ms ease;
  }

  .lang-link:active {
    background: rgba(142, 116, 65, 0.06);
    color: var(--color-warm-gold-deep);
  }

  .lang-code {
    font-family: var(--font-sc);
    font-size: 11px;
    letter-spacing: 0.32em;
    color: var(--color-warm-gold);
    text-align: left;
  }

  .lang-name {
    font-family: var(--font-heading);
    font-size: 26px;
    font-weight: 400;
    letter-spacing: 0.02em;
    text-align: center;
  }

  .lang-mark {
    justify-self: end;
    width: 24px;
    height: 1px;
    background: var(--color-rule);
    transition: width 360ms var(--ease-bleed), background 320ms ease;
  }

  .lang-link:active .lang-mark {
    width: 36px;
    background: var(--color-warm-gold);
  }

  .footnote {
    margin-top: 40px;
    font-family: var(--font-sc);
    font-size: 10px;
    letter-spacing: 0.36em;
    text-transform: uppercase;
    color: var(--color-text-light);
    opacity: 0;
    animation: fade-in 900ms var(--ease-bleed) 1700ms forwards;
  }

  @keyframes ink-bleed {
    0%   { clip-path: inset(0 100% 0 0); filter: blur(2px); }
    60%  { filter: blur(0.4px); }
    100% { clip-path: inset(0 0 0 0); filter: blur(0); }
  }

  @keyframes fade-in { to { opacity: 1; } }
  @keyframes row-rise { to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 360px) {
    .title { font-size: 72px; }
    .lang-name { font-size: 23px; }
    .lang-link { grid-template-columns: 38px 1fr 38px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .lodge-name, .title, .ornament, .lang-row, .footnote {
      animation: none;
      opacity: 1;
      transform: none;
      clip-path: none;
      filter: none;
    }
    .lang-link, .lang-mark { transition: none; }
  }
</style>
</head>
<body>
  <main class="frame">
    <div class="lodge-name">Olympos Lodge</div>

    <div class="title-wrap">
      <h1 class="title">Menu</h1>
      <div class="ornament" aria-hidden="true">
        <span class="ornament-rule"></span>
        <span class="ornament-dot"></span>
        <span class="ornament-rule"></span>
      </div>
    </div>

    <ul class="languages" aria-label="Menu language selection">
      <li class="lang-row">
        <a class="lang-link" href="assets/menu/menu-tr.pdf" target="_blank" rel="noopener" hreflang="tr">
          <span class="lang-code">TR</span>
          <span class="lang-name">Türkçe</span>
          <span class="lang-mark" aria-hidden="true"></span>
        </a>
      </li>
      <li class="lang-row">
        <a class="lang-link" href="assets/menu/menu-en.pdf" target="_blank" rel="noopener" hreflang="en">
          <span class="lang-code">EN</span>
          <span class="lang-name">English</span>
          <span class="lang-mark" aria-hidden="true"></span>
        </a>
      </li>
      <li class="lang-row">
        <a class="lang-link" href="assets/menu/menu-de.pdf" target="_blank" rel="noopener" hreflang="de">
          <span class="lang-code">DE</span>
          <span class="lang-name">Deutsch</span>
          <span class="lang-mark" aria-hidden="true"></span>
        </a>
      </li>
    </ul>

    <div class="footnote">Çıralı · Antalya</div>
  </main>
</body>
</html>
