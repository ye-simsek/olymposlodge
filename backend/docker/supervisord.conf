; Custom Sail supervisor config: runs the PHP server AND the Inertia SSR server.
; Replicates Sail's default [program:php] and adds [program:ssr] so SSR is live
; in the standard `sail up` setup (not just when started manually).
; Mounted over /etc/supervisor/conf.d/supervisord.conf via compose.yaml.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:ssr]
command=/usr/bin/php /var/www/html/artisan inertia:start-ssr
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
autostart=true
autorestart=true
startretries=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
